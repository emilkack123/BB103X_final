name: vina-docking-env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - vina
  - numpy
  - pandas  # Optional, if you plan to manipulate data later
  - openbabel  # Needed for molecular file format handling
  - autodocktools 
  - pip
  - pip:
      - vina  # Ensure vina is also available via pip if conda version has issues

